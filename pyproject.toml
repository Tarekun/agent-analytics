[project]
name = "agent-analytics"
version = "0.1.0"
description = "Collect analytics about coding-agent sessions (Claude Code, ...) into a local JSON store."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-analytics = "agent_analytics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_analytics"]
